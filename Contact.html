<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact - Weyland LaBelle</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Information for Weyland LaBelle">
    <link rel="stylesheet" href="weylandlabelle.css">
</head>

<body>
<div id="wrapper">

    <div class="banner">
        <h1>Contact Me</h1>
        <p>Reach Out • Connect • Collaborate</p>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="resume.html">Resume</a>
        <a href="Portfolio.html">Portfolio</a>
        <a href="Newsletter.html">Newsletter</a>
        <a href="Contact.html">Contact</a>
    </nav>

    <header>
        <img src="images/KeyboardContact.jpeg" alt="Keyboard Contact" class="medium-photo">
    </header>

    <main>
        <p>
            Thanks for visiting my website! If you have any questions or inquiries, feel free to reach 
            out via email at <strong>w.labelle@icloud.com</strong>.
        </p>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="your.email@example.com">

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6" placeholder="Your message here..."></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Weyland LaBelle. All rights reserved.</p>
    </footer>

</div> <!-- close wrapper -->
</body>
</html>
